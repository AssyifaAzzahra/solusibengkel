name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-deploy.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-deploy.txt
          pip install pytest ruff httpx

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit test (pytest)
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image Docker
        run: docker build -t restock-app .
